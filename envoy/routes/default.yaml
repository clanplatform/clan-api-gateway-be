# Fallback virtual host — served for any domain not matched by a tenant vhost.
# This is injected last in the virtual_hosts list by xds_service.build_route_config().
name: fallback
domains:
  - "*"
routes:
  - match:
      prefix: /health
    direct_response:
      status: 200
      body:
        inline_string: '{"status":"ok"}'
    response_headers_to_add:
      - header:
          key: content-type
          value: application/json
        keep_empty_value: false

  - match:
      prefix: /
    direct_response:
      status: 404
      body:
        inline_string: '{"detail":"tenant not found — check the Host header"}'
    response_headers_to_add:
      - header:
          key: content-type
          value: application/json
        keep_empty_value: false

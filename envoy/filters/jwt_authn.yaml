# JWT authentication filter fragment — REFERENCE ONLY.
# The live filter is built programmatically in xds/server.py from settings
# (jwt_issuer / jwt_audience / jwks_uri), NOT from this file. Values below are
# kept aligned with the clan-identity auth-service purely as documentation.
name: envoy.filters.http.jwt_authn
typed_config:
  "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
  providers:
    clan_jwt:
      issuer: clan-identity
      audiences:
        - api-gateway
      remote_jwks:
        http_uri:
          uri: http://clan-auth-service:8000/.well-known/jwks.json
          cluster: jwks_cluster
          timeout: 5s
        cache_duration: 300s
        async_fetch:
          fast_listener: true
      forward: true
      payload_in_metadata: jwt_payload
      claim_to_headers:
        - header_name: x-tenant-id
          claim_name: tenant_id
        - header_name: x-user-id
          claim_name: sub
        - header_name: x-app-id
          claim_name: app_id
  rules:
    # Public paths — no JWT required
    - match:
        prefix: /health
      requires: {}
    - match:
        prefix: /metrics
      requires: {}
    - match:
        prefix: /xds
      requires: {}
    # Everything else requires a valid clan_jwt token
    - match:
        prefix: /
      requires:
        provider_name: clan_jwt

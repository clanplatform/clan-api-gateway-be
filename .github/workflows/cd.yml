name: CD

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"

env:
  REGISTRY: ghcr.io
  GATEWAY_IMAGE: ghcr.io/${{ github.repository_owner }}/api-gateway-service
  ENVOY_IMAGE: ghcr.io/${{ github.repository_owner }}/api-gateway-envoy

jobs:
  push-images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      gateway_tag: ${{ steps.meta-gateway.outputs.version }}
      envoy_tag: ${{ steps.meta-envoy.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Gateway metadata
        id: meta-gateway
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GATEWAY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build & push gateway-service
        uses: docker/build-push-action@v6
        with:
          context: gateway-service
          file: gateway-service/Dockerfile
          push: true
          tags: ${{ steps.meta-gateway.outputs.tags }}
          labels: ${{ steps.meta-gateway.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Envoy metadata
        id: meta-envoy
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ENVOY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short

      - name: Build & push envoy
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.envoy
          push: true
          tags: ${{ steps.meta-envoy.outputs.tags }}
          labels: ${{ steps.meta-envoy.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-uat:
    name: Deploy → UAT
    needs: push-images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: uat
    concurrency:
      group: deploy-uat
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig (UAT)
        run: echo "${{ secrets.KUBECONFIG_UAT }}" | base64 -d > $HOME/.kube/config

      - name: Apply k8s manifests
        run: kubectl apply -f deploy/k8s/ -n clan-gateway

      - name: Roll out gateway-service
        run: |
          kubectl set image deployment/gateway-service \
            gateway-service=${{ env.GATEWAY_IMAGE }}:sha-$(git rev-parse --short HEAD) \
            -n clan-gateway
          kubectl rollout status deployment/gateway-service -n clan-gateway --timeout=300s

      - name: Roll out envoy
        run: |
          kubectl set image deployment/envoy \
            envoy=${{ env.ENVOY_IMAGE }}:sha-$(git rev-parse --short HEAD) \
            -n clan-gateway
          kubectl rollout status deployment/envoy -n clan-gateway --timeout=300s

  deploy-prod:
    name: Deploy → Production
    needs: push-images
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig (prod)
        run: echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > $HOME/.kube/config

      - name: Apply k8s manifests
        run: kubectl apply -f deploy/k8s/ -n clan-gateway

      - name: Roll out gateway-service
        run: |
          TAG=${GITHUB_REF_NAME}
          kubectl set image deployment/gateway-service \
            gateway-service=${{ env.GATEWAY_IMAGE }}:${TAG} \
            -n clan-gateway
          kubectl rollout status deployment/gateway-service -n clan-gateway --timeout=300s

      - name: Roll out envoy
        run: |
          TAG=${GITHUB_REF_NAME}
          kubectl set image deployment/envoy \
            envoy=${{ env.ENVOY_IMAGE }}:${TAG} \
            -n clan-gateway
          kubectl rollout status deployment/envoy -n clan-gateway --timeout=300s

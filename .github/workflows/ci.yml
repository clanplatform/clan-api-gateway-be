name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway-service

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: api_gateway_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gateway-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check app/ tests/

      - name: Type check (mypy)
        run: mypy app/ --ignore-missing-imports --strict

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/api_gateway_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-only-32ch
          ENVIRONMENT: test
          DEBUG: "false"
          JWT_ALGORITHM: HS256
          JWT_ISSUER: http://test
          JWT_AUDIENCE: api-gateway
        run: >
          pytest tests/ -v
          --cov=app --cov-report=xml --cov-report=term-missing
          --cov-fail-under=80
          -p no:warnings

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: gateway-service/coverage.xml
          flags: gateway-service

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build gateway-service image
        uses: docker/build-push-action@v6
        with:
          context: gateway-service
          file: gateway-service/Dockerfile
          push: false
          tags: clan/api-gateway-service:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build envoy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.envoy
          push: false
          tags: clan/api-gateway-envoy:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

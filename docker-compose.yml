services:
  # No local postgres container — all repos share one Postgres server
  # (admin-service-postgres, published on host port 5432, db clan_platform).

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "6384:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway-service:
    build:
      context: gateway-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:root@host.docker.internal:5432/clan_platform
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-minimum-32-chars!!
      ENVIRONMENT: development
      DEBUG: "true"
      LOG_LEVEL: DEBUG
      METRICS_ENABLED: "true"
      JWT_ALGORITHM: RS256
      JWT_ISSUER: clan-identity
      JWT_AUDIENCE: api-gateway
      # auth-service is reachable by container name via the shared clan-network.
      JWKS_URI: http://clan-auth-service:8000/.well-known/jwks.json
      GATEWAY_DOMAIN: api.localhost
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal-secret-key}
    ports:
      - "8010:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - ./gateway-service/app:/app/app          # hot-reload in dev
      - ./gateway-service/alembic:/app/alembic  # migration files
      - ./gateway-service/alembic.ini:/app/alembic.ini
    networks:
      - default
      - clan-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  envoy:
    build:
      context: .
      dockerfile: Dockerfile.envoy
    ports:
      - "8080:8080"
      - "8443:8443"
      - "9901:9901"
    depends_on:
      gateway-service:
        condition: service_healthy
    networks:
      - default
      - clan-network
    # host.docker.internal kept for admin-service and other host-based services.
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  default:
  clan-network:
    external: true

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: api_gateway
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway-service:
    build:
      context: gateway-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/api_gateway
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-minimum-32-chars!!
      ENVIRONMENT: development
      DEBUG: "true"
      LOG_LEVEL: DEBUG
      METRICS_ENABLED: "true"
      JWT_ALGORITHM: HS256
      JWT_ISSUER: http://localhost:8000
      JWT_AUDIENCE: api-gateway
      JWKS_URI: http://localhost:8000/.well-known/jwks.json
      GATEWAY_DOMAIN: api.localhost
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - ./gateway-service/app:/app/app  # hot-reload in dev

  envoy:
    build:
      context: .
      dockerfile: Dockerfile.envoy
    ports:
      - "8080:8080"
      - "8443:8443"
      - "9901:9901"
    depends_on:
      gateway-service:
        condition: service_healthy

volumes:
  postgres_data:
